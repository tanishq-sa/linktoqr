<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="white" rx="20"/>
  
  <!-- Top Left Finder Pattern -->
  <rect x="15" y="15" width="25" height="25" fill="black" rx="4"/>
  <rect x="20" y="20" width="15" height="15" fill="white" rx="2"/>
  <rect x="25" y="25" width="5" height="5" fill="black"/>
  
  <!-- Top Right Finder Pattern -->
  <rect x="60" y="15" width="25" height="25" fill="black" rx="4"/>
  <rect x="65" y="20" width="15" height="15" fill="white" rx="2"/>
  <rect x="70" y="25" width="5" height="5" fill="black"/>
  
  <!-- Bottom Left Finder Pattern -->
  <rect x="15" y="60" width="25" height="25" fill="black" rx="4"/>
  <rect x="20" y="65" width="15" height="15" fill="white" rx="2"/>
  <rect x="25" y="70" width="5" height="5" fill="black"/>

  <!-- Random Modules -->
  <rect x="50" y="15" width="5" height="5" fill="black"/>
  <rect x="45" y="25" width="5" height="5" fill="black"/>
  <rect x="50" y="35" width="5" height="5" fill="black"/>
  <rect x="15" y="45" width="5" height="5" fill="black"/>
  <rect x="30" y="45" width="15" height="5" fill="black"/>
  <rect x="55" y="45" width="10" height="5" fill="black"/>
  <rect x="75" y="45" width="10" height="5" fill="black"/>
  
  <rect x="45" y="55" width="5" height="10" fill="black"/>
  <rect x="55" y="60" width="10" height="5" fill="black"/>
  <rect x="75" y="60" width="5" height="5" fill="black"/>
  <rect x="65" y="75" width="5" height="10" fill="black"/>
  <rect x="75" y="75" width="10" height="5" fill="black"/>
  
  <rect x="45" y="75" width="10" height="5" fill="black"/>
  <rect x="50" y="80" width="5" height="5" fill="black"/>
</svg>
